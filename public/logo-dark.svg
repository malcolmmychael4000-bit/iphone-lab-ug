          transform="translate(18, 52)"
          fill="#00A3C4" />

    <!-- Refined Gear Path matching original brand asset -->
    <path d="M 68 18 C 76 22, 82 30, 84 38 C 85 45, 81 54, 76 60 C 82 63, 89 67, 93 74 L 102 72 C 108 71, 114 76, 114 82 L 114 88 C 114 94, 109 100, 102 101 L 93 103 C 90 110, 85 116, 78 121 L 82 129 C 85 135, 83 142, 78 147 L 73 151 C 68 155, 61 155, 56 150 L 49 143 C 42 146, 35 147, 27 146 L 24 155 C 22 161, 16 165, 10 165 L 4 165 C -2 165, -8 161, -10 155 L -13 146 C -20 145, -27 142, -34 137 L -42 143 C -47 147, -54 146, -58 141 L -63 136 C -67 131, -67 124, -63 118 L -57 111 C -60 104, -62 97, -62 89 L -71 86 C -77 84, -81 78, -81 72 L -81 66 C -81 60, -77 54, -71 52 L -62 50 C -61 42, -58 35, -53 28 L -59 21 C -63 16, -62 9, -57 4 L -52 0 C -47 -4, -40 -4, -36 1 L -29 8 C -22 5, -15 3, -7 4 L -5 -5 C -3 -11, 3 -15, 9 -15 L 15 -15 C 21 -15, 27 -11, 29 -5 L 31 4 C 39 5, 46 8, 52 13 Z"
          fill="#00A3C4"
          transform="matrix(0.72 0 0 0.72 40 45)" />

    <!-- Center Circle with Apple Logo -->
