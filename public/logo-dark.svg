<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 180" fill="none">
  <!-- Typography: iPhone Lab -->
  <g fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="12" y="78" font-size="74" font-weight="700" letter-spacing="-1.5px">iPhone</text>
    <text x="142" y="152" font-size="74" font-weight="700" letter-spacing="-1.5px">Lab</text>
  </g>

  <!-- Gear & Apple Icon with Orbital Dots -->
  <g transform="translate(290, 8)">
