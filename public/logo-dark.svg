    <!-- Apple Logo (White on Black) -->
    <g transform="translate(34, 62) scale(0.68)">
      <!-- Leaf -->
      <path d="M 27.5 7.5 C 29.5 5, 31 1.5, 30.5 -2 C 27.5 -1.8, 24 0.2, 22 2.5 C 20.2 4.6, 18.8 8.1, 19.3 11.5 C 22.5 11.7, 25.8 9.8, 27.5 7.5 Z" fill="#FFFFFF" />
      <!-- Body -->
