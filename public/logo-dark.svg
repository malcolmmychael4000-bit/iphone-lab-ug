    <!-- Cyan dot -->
    <circle cx="98" cy="18" r="8.5" fill="#00A3C4" />
    <!-- Yellow dot -->
    <circle cx="128" cy="16" r="11" fill="#F0A500" />
    <!-- Red dot -->
    <circle cx="128" cy="48" r="14" fill="#D32F2F" />

    <!-- Stylized Cyan Gear Body -->
